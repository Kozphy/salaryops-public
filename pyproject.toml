[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "salaryops"
version = "0.1.0"
description = "Negotiation control plane: deterministic offer analysis, policy gates, and audit evidence for salary negotiation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pycountry>=24.6",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.16", "mypy>=2.4", "types-PyYAML>=6.0"]
ui = ["streamlit>=1.64"]

[project.scripts]
salaryops = "salaryops.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
salaryops = ["offer_template.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["salaryops"]
branch = true
omit = ["*/salaryops/__main__.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
